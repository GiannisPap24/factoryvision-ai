[server]
address = "127.0.0.1"
port = 8501
headless = true
fileWatcherType = "none"
maxUploadSize = 8
enableStaticServing = false
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
font = "sans serif"
headingFont = "sans serif"
baseFontSize = 16
headingFontSizes = ["2rem", "1.5rem", "1.25rem", "1.1rem", "1rem", "1rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "1.65rem"
baseRadius = "0.5rem"
buttonRadius = "0.375rem"
borderColor = "#CBD5E1"
showWidgetBorder = true
linkColor = "#1D4ED8"
codeBackgroundColor = "#E2E8F0"
codeTextColor = "#1E293B"
dataframeHeaderBackgroundColor = "#E2E8F0"
dataframeHeaderTextColor = "#1E293B"
redColor = "#DC2626"
orangeColor = "#C2410C"
yellowColor = "#A16207"
blueColor = "#2563EB"
greenColor = "#0D9488"
# Framework palette aliases deliberately use teal, never violet.
violetColor = "#0D9488"
violetBackgroundColor = "#CCFBF1"
violetTextColor = "#115E59"
redTextColor = "#991B1B"
blueTextColor = "#075985"
blueBackgroundColor = "#E0F2FE"
yellowBackgroundColor = "#FEF3C7"
redBackgroundColor = "#FEE2E2"
orangeBackgroundColor = "#FFEDD5"
greenBackgroundColor = "#CCFBF1"
grayBackgroundColor = "#F1F5F9"
greenTextColor = "#115E59"
yellowTextColor = "#854D0E"
grayTextColor = "#475569"
chartCategoricalColors = ["#2563EB", "#0D9488", "#C2410C", "#A16207", "#DC2626", "#475569"]
chartSequentialColors = ["#FFF7BC", "#FEEAA1", "#FEDD83", "#FECE62", "#FEC44F", "#FBA532", "#F08020", "#D95F0E", "#B74608", "#993404"]
chartDivergingColors = ["#164E63", "#0E7490", "#0891B2", "#67E8F9", "#CFFAFE", "#FFF7BC", "#FEC44F", "#F08020", "#D95F0E", "#993404"]

[theme.sidebar]
backgroundColor = "#101B2B"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
primaryColor = "#60A5FA"
borderColor = "#475569"
linkColor = "#93C5FD"
