[server]
address = "127.0.0.1"
port = 8501
headless = true
fileWatcherType = "none"
maxUploadSize = 8
enableStaticServing = false
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[theme]
base = "light"
paddingTop = "1rem"
paddingBottom = "2rem"
primaryColor = "#2563EB"
backgroundColor = "#E5ECF2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172438"
font = "IBM Plex Sans"
headingFont = "IBM Plex Sans"
baseFontSize = 16
headingFontSizes = ["2rem", "1.5rem", "1.25rem", "1.1rem", "1rem", "1rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.5rem"
baseRadius = "0.5rem"
buttonRadius = "0.375rem"
borderColor = "#64748B"
showWidgetBorder = true
linkColor = "#1D4ED8"
codeBackgroundColor = "#E2E8F0"
codeTextColor = "#1E293B"
dataframeHeaderBackgroundColor = "#E2EDF4"
dataframeHeaderTextColor = "#1E293B"
redColor = "#DC2626"
orangeColor = "#C2410C"
yellowColor = "#A16207"
blueColor = "#2563EB"
greenColor = "#0D9488"
# Framework palette aliases deliberately use teal, never violet.
violetColor = "#0D9488"
violetBackgroundColor = "#E8F4EF"
violetTextColor = "#115E59"
redTextColor = "#991B1B"
blueTextColor = "#075985"
blueBackgroundColor = "#EAF3FA"
yellowBackgroundColor = "#FFF4D6"
redBackgroundColor = "#FEF0EE"
orangeBackgroundColor = "#FFEDD5"
greenBackgroundColor = "#E8F4EF"
grayBackgroundColor = "#F1F5F9"
greenTextColor = "#115E59"
yellowTextColor = "#854D0E"
grayTextColor = "#526277"
chartCategoricalColors = ["#2563EB", "#0D9488", "#C2410C", "#A16207", "#DC2626", "#475569"]
chartSequentialColors = ["#FFF7BC", "#FEEAA1", "#FEDD83", "#FECE62", "#FEC44F", "#FBA532", "#F08020", "#D95F0E", "#B74608", "#993404"]
chartDivergingColors = ["#164E63", "#0E7490", "#0891B2", "#67E8F9", "#CFFAFE", "#FFF7BC", "#FEC44F", "#F08020", "#D95F0E", "#993404"]

[theme.sidebar]
paddingTop = "1rem"
backgroundColor = "#102638"
secondaryBackgroundColor = "#1B354B"
textColor = "#F1F5F9"
primaryColor = "#60A5FA"
borderColor = "#475569"
linkColor = "#93C5FD"
